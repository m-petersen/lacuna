name: Publish Docs
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install \
            mkdocs-material \
            mkdocs-autorefs \
            "mkdocstrings[python]" \
            mkdocs-gen-files \
            mkdocs-literate-nav \
            mkdocs-section-index \
            mkdocs-jupyter

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
